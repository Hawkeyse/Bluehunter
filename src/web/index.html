<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueHunter discoverable group chats</title>
<link id="fav" rel="icon">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#060b12;--bg2:#0d1a26;--panel:#0f1c29;--ink:#eef4fa;--mute:#8ea3b8;--line:#1c2f3f;
  --blue:#3b9bde;--blue2:#1a5f8f;--ok:#2ed195;--warn:#e6ac3f;--bad:#f05a4b;--banned:#b39bfa;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*{box-sizing:border-box}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;position:relative;overflow-x:hidden}
.wrap{max-width:880px;margin:0 auto;padding:0 20px;position:relative}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:20px 0}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:34px;height:34px;border-radius:9px;display:block;box-shadow:0 0 0 1px #ffffff22,0 0 18px -2px #3b9bde99}
.brand b{font-weight:800;font-size:1.1rem;letter-spacing:-.01em}
nav{display:flex;gap:18px;align-items:center}
nav a,nav button{color:var(--mute);text-decoration:none;background:none;border:0;padding:0;cursor:pointer;font:inherit}
nav a:hover,nav button:hover{color:var(--ink)}
a{color:var(--blue)}
:focus-visible{outline:3px solid #7fb4d6;outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}

.glow{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none;z-index:0;mix-blend-mode:screen}
.glow.a{width:420px;height:420px;background:#1a5f8f;top:-160px;left:-120px;animation:drift1 22s ease-in-out infinite alternate}
.glow.b{width:340px;height:340px;background:#3b9bde;top:60px;right:-140px;animation:drift2 26s ease-in-out infinite alternate}
@keyframes drift1{from{transform:translate(0,0) scale(1)}to{transform:translate(40px,60px) scale(1.15)}}
@keyframes drift2{from{transform:translate(0,0) scale(1)}to{transform:translate(-50px,30px) scale(1.1)}}

.hero{padding:34px 0 30px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;position:relative;z-index:1}
@keyframes ping{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
.hero .txt{flex:1;min-width:220px}
.headline{font-size:clamp(1.9rem,6vw,3.2rem);font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:0 0 14px;background:linear-gradient(100deg,var(--ink),var(--blue) 120%);-webkit-background-clip:text;background-clip:text;color:transparent}
.headline.sm{font-size:clamp(1.5rem,4.5vw,2.3rem);margin:8px 0 12px;background:none;-webkit-text-fill-color:currentColor;color:var(--ink)}
.facts{display:flex;gap:4px 22px;flex-wrap:wrap;color:var(--mute);margin:0 0 14px;font-size:.95rem}

.welcome{padding:10px 0 6px;position:relative;z-index:1}
.welcome h2{font-size:clamp(1.5rem,4vw,2.1rem);font-weight:800;letter-spacing:-.015em;margin:0 0 6px}
.welcome>p{color:var(--mute);max-width:56ch;margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;opacity:0;transform:translateY(10px);animation:rise .5s ease forwards}
.card:nth-child(1){animation-delay:.03s}.card:nth-child(2){animation-delay:.09s}.card:nth-child(3){animation-delay:.15s}
.card:nth-child(4){animation-delay:.21s}.card:nth-child(5){animation-delay:.27s}.card:nth-child(6){animation-delay:.33s}
@keyframes rise{to{opacity:1;transform:none}}
.card{transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--blue2);transform:translateY(-2px)}
.card .ic{font-size:1.4rem;display:block;margin-bottom:10px}
.card b{display:block;font-weight:600;margin-bottom:4px}
.card p{margin:0;color:var(--mute);font-size:.92rem;line-height:1.5}
.card.soon{border-style:dashed;opacity:.85;animation:none;transform:none}
.tag{display:inline-block;font-size:.7rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--banned);border:1px solid #6d5bb333;background:#6d5bb31a;border-radius:5px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.badge{margin-top:24px;color:var(--mute);font-size:.85rem;display:flex;align-items:center;gap:8px}
.badge svg{width:15px;height:15px;color:var(--ok);flex-shrink:0}

.blk{border-top:1px solid var(--line);padding:34px 0;position:relative;z-index:1}
h2{font-size:1.3rem;font-weight:600;margin:0 0 12px}
h3{font-size:1rem;font-weight:600;margin:0 0 6px}
code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 6px;color:var(--blue)}
.steps{padding-left:1.2em;max-width:60ch;color:var(--ink)}.steps li{margin:4px 0}
.codeform{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.codeform input{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.2rem;letter-spacing:.18em;text-transform:uppercase;width:12ch}
select,input[type=text],input[type=search],textarea{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 11px;color:var(--ink)}
.btn{background:var(--blue);color:#04121c;border:0;border-radius:6px;padding:10px 18px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.link-btn{background:none;border:0;color:var(--blue);cursor:pointer;font:inherit;padding:0}
.err{color:var(--bad);margin:10px 0 0;min-height:1.4em}
.log ul{margin:0 0 26px;padding-left:1.1em;max-width:70ch;color:var(--mute)}.log li{margin:5px 0}
.grouplist a{display:block;padding:10px 0;border-bottom:1px solid var(--line);color:var(--ink)}
.gpfp{width:56px;height:56px;border-radius:16px;object-fit:cover;box-shadow:0 0 0 1px #ffffff1a,0 8px 24px -8px #000;flex-shrink:0}
.gpfp.fallback{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blue2),var(--blue));color:#04121c;font-weight:800;font-size:1.4rem}
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 18px;min-width:130px}
.stat b{display:block;font-size:1.5rem;font-weight:800}
.stat small{color:var(--mute);font-size:.82rem}
.board h3{margin:0 0 12px;font-size:1rem;font-weight:600}
.charts{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin:0 0 24px}
.chartbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chartbox h3{margin:0 0 3px;font-size:.95rem;font-weight:600}
.chint{color:var(--mute);font-size:.8rem;margin:0 0 10px}
.line svg{display:block;width:100%;height:auto;overflow:visible}
.line .grid line{stroke:var(--line);stroke-width:1}
.line .grid text,.line .axis text{fill:var(--mute);font-size:10px}
.line polygon.area{fill:var(--blue);opacity:.13;stroke:none}
.line polyline{fill:none;stroke:var(--blue);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.line circle{fill:var(--blue);stroke:var(--panel);stroke-width:1.5}
.line.warn polygon.area{fill:#e0a03a}
.line.warn polyline{stroke:#e0a03a}
.line.warn circle{fill:#e0a03a}
.bar-row{padding:7px 0}
.bar-row .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:5px}
.bar-row .rank{color:var(--mute);font-size:.8rem;width:2em;flex-shrink:0}
.bar-row .bname{flex:1;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .bcount{color:var(--mute);font-size:.85rem;flex-shrink:0}
.bwrap{background:var(--line);border-radius:4px;height:6px;overflow:hidden}
.bar{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--blue));border-radius:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.row.col{display:block}
.row b{display:block;font-weight:600}.row small{display:block;color:var(--mute)}
.ctl{display:flex;gap:10px;align-items:center;flex-shrink:0;color:var(--mute)}
textarea{width:100%;min-height:76px;margin-top:8px;resize:vertical}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:#24384a;position:relative;cursor:pointer;margin:0;transition:background .15s;flex-shrink:0}
input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
input[type=checkbox]:checked{background:var(--blue)}input[type=checkbox]:checked::after{transform:translateX(18px)}
.bar{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:10px}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:2}
#toast.on{opacity:1}#toast.bad{background:var(--bad);color:#fff}

[hidden]{display:none!important}
.wrap.wide{max-width:1120px}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin:0 0 6px;overflow-x:auto;position:relative;z-index:1}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:12px 16px;cursor:pointer;font-weight:600;white-space:nowrap}
.tab:hover{color:var(--ink)}.tab.on{color:var(--ink);border-bottom-color:var(--blue)}
.tab em{font-style:normal;background:var(--warn);color:#04121c;border-radius:999px;font-size:.72rem;padding:1px 8px;margin-left:8px}
.chartbox.big{padding:20px 22px 18px;margin:0 0 24px;background:var(--panel);border-color:var(--line);box-shadow:0 8px 26px rgba(0,0,0,.16)}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.chead h3{display:block;margin:0 0 4px;font-size:1.15rem}
.chart-subtitle{margin:0;color:var(--mute);font-size:.84rem}
.chart-controls{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.livepill{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;color:var(--mute)}
.livepill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.segs{display:flex;background:#0a141d;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg{background:none;border:0;color:var(--mute);padding:7px 12px;border-radius:7px;cursor:pointer;font-size:.86rem}
.seg.on{background:var(--blue);color:#04121c;font-weight:700}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:.82rem;margin:0 0 8px}
.legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:16px;height:4px;border-radius:2px;display:inline-block}
.cwrap{position:relative}
.bigc{display:block;width:100%;height:clamp(280px,42vh,400px);touch-action:pan-y}
.ctip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:.82rem;white-space:nowrap;transform:translate(-50%,-125%);z-index:2}
.cstats{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px;padding-top:14px;border-top:1px solid var(--line)}
.cstats b{display:block;font-size:1.5rem;font-weight:800}.cstats small{color:var(--mute)}
.cstats .trend b{font-size:1.15rem}
.del{display:grid;gap:12px;margin-top:16px}
.dm{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.dm .meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--mute);font-size:.85rem;margin-bottom:9px}
.dm .meta b{color:var(--ink);font-weight:600}
.dm .txt{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a141d;border-left:3px solid var(--warn);border-radius:6px;padding:9px 12px}
.dm .txt.empty{color:var(--mute);font-style:italic}
.dm .media{display:inline-block;color:var(--warn);font-size:.9rem;margin-bottom:6px}
.emptybox{border:1px dashed var(--line);border-radius:14px;padding:26px;color:var(--mute)}
.emptybox b{display:block;color:var(--ink);margin-bottom:4px}

.chips2{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 6px}
.chip2{background:var(--panel);border:1px solid var(--line);color:var(--mute);border-radius:999px;padding:7px 15px;cursor:pointer;font-size:.9rem}
.chip2:hover{color:var(--ink)}.chip2.on{background:var(--blue);border-color:var(--blue);color:#04121c;font-weight:700}
.lg{background:var(--panel);border:1px solid var(--line);border-left-width:4px;border-radius:14px;padding:14px 16px}
.lg.k-warn,.lg.k-strike,.lg.k-resetwarn{border-left-color:var(--warn)}
.lg.k-ai{border-left-color:#b39bfa}
.lg.k-mute,.lg.k-unmute{border-left-color:#7a8ea1}
.lg.k-kick,.lg.k-ban{border-left-color:var(--bad)}
.lg.k-unban,.lg.k-setting,.lg.k-admin_cmd{border-left-color:var(--blue)}
.lg .l1{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.lg .l1 .when{color:var(--mute);font-size:.85rem;white-space:nowrap}
.lg .rs{color:var(--mute);margin-top:4px;overflow-wrap:anywhere}
.via{display:inline-block;font-size:.76rem;color:var(--mute);border:1px solid var(--line);border-radius:6px;padding:1px 8px;margin-left:8px;vertical-align:middle}
.via.dash{color:#8cc9f2;border-color:#1a5f8f}
.chg{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:5px}
.chg li{background:#0a141d;border-radius:8px;padding:6px 10px;font-size:.93rem}
.chg s{color:var(--mute)}.chg b{color:var(--ok);font-weight:600}
.evid{margin-top:10px}
.evid .txt{white-space:pre-wrap;overflow-wrap:anywhere;background:#0a141d;border-left:3px solid #b39bfa;border-radius:6px;padding:9px 12px}
.evi{display:block;max-width:min(340px,100%);border-radius:10px;margin-top:8px;transition:filter .2s}
.evi.blur{filter:blur(22px)}

input[type=checkbox].mrow{appearance:auto;-webkit-appearance:auto;width:22px;height:22px;border-radius:4px;background:none;accent-color:var(--blue);cursor:pointer}
input[type=checkbox].mrow::after{display:none}
input[type=checkbox].mrow:checked{background:none}
.mem{padding:10px 0;cursor:pointer}.mem:hover{background:#ffffff08}
.selall{display:flex;align-items:center;gap:12px;padding:8px 0 10px;color:var(--mute);font-size:.92rem;cursor:pointer;border-bottom:1px solid var(--line)}

.otiles{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 18px}
.otile{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 20px;min-width:130px}
.otile b{display:block;font-size:1.7rem;font-weight:800}.otile small{color:var(--mute)}
.otools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.otools input{flex:1;min-width:180px}
.ogrp{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.ogrp .top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.ogrp .nm{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.ogrp .sm{color:var(--mute);font-size:.88rem;margin-top:2px}
.ogrp .acts{display:flex;gap:8px;flex-wrap:wrap}
.ogrp .acts .btn{padding:8px 14px;text-decoration:none;font-size:.9rem}
.ogrp textarea{width:100%;min-height:84px;box-sizing:border-box}
.pillb{font-size:.76rem;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--mute);margin-left:8px;white-space:nowrap}
.pillb.ok{color:var(--ok);border-color:#1d6a4d}.pillb.warn{color:var(--warn);border-color:#7a5a1d}
.btn.danger{background:#7a2c33;color:#ffd6d9}.btn.danger:hover{background:#9a3640}
.maint{background:#2b2110;border:1px solid #7a5a1d;color:#ffe2a8;border-radius:12px;padding:12px 16px;margin:0 0 14px;display:flex;gap:10px;align-items:flex-start;overflow-wrap:anywhere}
.maint[hidden]{display:none}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 18px;display:grid;gap:10px}
.mcard h3{margin:0}.mcard textarea{width:100%;min-height:72px;box-sizing:border-box}
.mcard .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mcard small{color:var(--mute)}

/* ---- big animated status hero (home page) ---- */
.sx{--c:#2ed195;--cr:46,209,149;position:relative;overflow:hidden;isolation:isolate;border-radius:28px;margin:10px 0 34px;padding:clamp(52px,9vw,96px) clamp(14px,4vw,48px) 26px;text-align:center;background:radial-gradient(900px 420px at 50% -10%,rgba(var(--cr),.2),transparent 70%),#06101a;border:1px solid rgba(var(--cr),.38);box-shadow:0 0 0 1px #ffffff08 inset,0 30px 90px -30px rgba(var(--cr),.5);transition:border-color .8s,box-shadow .8s}
.sx>*{position:relative;z-index:1}
.sx>canvas.sx-bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.sx-orb{position:relative;width:clamp(120px,22vw,170px);aspect-ratio:1;margin:0 auto 20px}
.sx-orb>i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--c);opacity:0;animation:sxping 3.2s cubic-bezier(.2,.6,.4,1) infinite}
.sx-orb>i:nth-child(2){animation-delay:1.06s}.sx-orb>i:nth-child(3){animation-delay:2.12s}
@keyframes sxping{0%{transform:scale(.85);opacity:.9}100%{transform:scale(2.3);opacity:0}}
.sx-orb::before{content:'';position:absolute;inset:-10px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 50%,var(--c) 88%,transparent 100%);animation:sxspin 2.2s linear infinite;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));filter:drop-shadow(0 0 8px var(--c))}
.sx-orb img{position:absolute;inset:13%;width:74%;height:74%;border-radius:28%;box-shadow:0 0 50px rgba(var(--cr),.65),0 0 0 1px #ffffff22;animation:sxfloat 4.5s ease-in-out infinite}
.sx-orbit{position:absolute;inset:-26px;border-radius:50%;animation:sxspin 7s linear infinite}
.sx-orbit::after{content:'';position:absolute;top:0;left:50%;width:11px;height:11px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--c);box-shadow:0 0 16px 5px rgba(var(--cr),.85)}
.sx-orbit.b{inset:-44px;animation-duration:12s;animation-direction:reverse;opacity:.7}
.sx-orbit.b::after{width:7px;height:7px;margin:-3px 0 0 -3px}
@keyframes sxspin{to{transform:rotate(360deg)}}
@keyframes sxfloat{50%{transform:translateY(-6px) scale(1.03)}}
.sx-live{display:inline-flex;align-items:center;gap:9px;padding:6px 16px;border-radius:999px;border:1px solid rgba(var(--cr),.55);background:rgba(var(--cr),.1);color:var(--c);font-weight:800;font-size:.78rem;letter-spacing:.22em;box-shadow:0 0 24px -4px rgba(var(--cr),.7)}
.sx-live i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:blink 1.1s ease-in-out infinite}
.sx-title{font-size:clamp(2.2rem,7.6vw,4.8rem);line-height:1.04;font-weight:800;letter-spacing:-.035em;margin:18px auto 12px;max-width:17ch;background:linear-gradient(100deg,#fff 0%,var(--c) 38%,#fff 62%,var(--c) 100%);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sxshine 6s linear infinite;filter:drop-shadow(0 0 26px rgba(var(--cr),.4));min-height:2.1em}
@keyframes sxshine{to{background-position:-260% 0}}
.sx-sub{font-size:clamp(1rem,2.4vw,1.35rem);color:var(--mute);margin:0}
.sx-up{color:var(--ink);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(var(--cr),.55)}
.sx-ecg{display:block;width:100%;height:96px;margin:20px 0 8px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.sx-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,16px);margin-top:14px;perspective:900px}

/* ================= PREMIUM FX LAYER (additive, safe to delete as one block) ================= */
.wrap{z-index:1}

#fx-bg{position:fixed;left:0;top:0;z-index:0;pointer-events:none}
.fx-aurora{position:fixed;inset:-25%;z-index:0;pointer-events:none;opacity:.8;background:conic-gradient(from 0deg at 50% 38%,rgba(26,95,143,0),rgba(59,155,222,.2),rgba(112,84,230,.14),rgba(46,209,149,.1),rgba(26,95,143,0));filter:blur(70px);animation:fxspin 46s linear infinite;will-change:transform}
@keyframes fxspin{to{transform:rotate(360deg)}}
#fx-cursor{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;z-index:0;mix-blend-mode:screen;opacity:0;transition:opacity .4s;background:radial-gradient(circle,rgba(59,155,222,.17),rgba(59,155,222,.05) 42%,transparent 70%);will-change:transform}
#fx-prog{position:fixed;left:0;top:0;right:0;height:3px;z-index:20;transform-origin:left;transform:scaleX(0);pointer-events:none;background:linear-gradient(90deg,#1a5f8f,#3b9bde,#7fd0ff,#2ed195);box-shadow:0 0 14px 1px rgba(59,155,222,.85)}

/* header turns into floating glass once you scroll */
header{position:sticky;top:8px;z-index:6;transition:background .35s,box-shadow .35s,padding .35s,border-color .35s,backdrop-filter .35s;border:1px solid transparent;border-radius:18px}
.fx-scrolled header{padding:11px 16px;background:rgba(8,16,24,.72);-webkit-backdrop-filter:blur(16px) saturate(1.5);backdrop-filter:blur(16px) saturate(1.5);border-color:rgba(59,155,222,.22);box-shadow:0 18px 50px -24px #000,0 0 0 1px #ffffff08 inset}
.brand img{animation:fxlogo 4.5s ease-in-out infinite;transition:transform .6s cubic-bezier(.34,1.56,.64,1)}
.brand:hover img{transform:rotate(-10deg) scale(1.14)}
@keyframes fxlogo{50%{box-shadow:0 0 0 1px #ffffff33,0 0 30px 2px #3b9bdecc}}
nav a,nav button{position:relative;transition:color .2s}
nav a::after,nav button::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--blue),#7fd0ff);transform:scaleX(0);transform-origin:left;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
nav a:hover::after,nav button:hover::after{transform:scaleX(1)}

/* headings that shimmer */
.headline{background-image:linear-gradient(100deg,#fff 0%,var(--blue) 40%,#fff 62%,var(--blue) 100%);background-size:260% 100%;animation:sxshine 8s linear infinite}
.welcome h2,.clh h1{text-shadow:0 0 40px rgba(59,155,222,.25)}
.fx-ld{background:linear-gradient(90deg,var(--mute) 30%,#fff 50%,var(--mute) 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:fxld 1.4s linear infinite}
@keyframes fxld{to{background-position:-250% 0}}

/* page swap + scroll reveal (attributes are added by the script, so nothing hides without it) */
#app.fx-swap{animation:fxpage .6s cubic-bezier(.2,.8,.2,1)}
@keyframes fxpage{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.card{opacity:1;transform:none;animation:none}
[data-fx-r]{opacity:0;transform:translateY(28px) scale(.97);filter:blur(8px)}
[data-fx-r].fx-in{opacity:1;transform:none;filter:none;transition:opacity .7s ease var(--d,0ms),transform .85s cubic-bezier(.2,.8,.2,1) var(--d,0ms),filter .7s ease var(--d,0ms)}
[data-fx-r="soft"]{transform:none;filter:none}
[data-fx-r="soft"].fx-in{transition:opacity .4s ease}
.fx-low [data-fx-r]{filter:none}

/* spotlight + glowing border that follow the pointer */
.fx{position:relative}
.fx::before{content:'';position:absolute;inset:-1px;border-radius:inherit;padding:1px;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),rgba(127,208,255,.95),rgba(59,155,222,.25) 45%,transparent 70%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);mask-composite:exclude}
.fx::after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(360px circle at var(--mx,50%) var(--my,50%),rgba(59,155,222,.11),transparent 62%)}
.fx:hover::before,.fx:hover::after{opacity:1}
@media (hover:hover) and (pointer:fine){

}

/* charts */
.line.fx-draw polyline{stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 5px rgba(59,155,222,.7));animation:fxdraw 1.8s cubic-bezier(.4,0,.2,1) .2s forwards}

.directory-main{min-width:0}
.directory-main p{margin-bottom:8px;font-size:.9rem}
.directory-open{grid-column:2;justify-self:start;white-space:nowrap;color:var(--blue);font-size:.82rem;font-weight:700}
.directory-country{display:inline-flex;gap:3px;margin-left:5px;font-size:1rem;vertical-align:baseline}
.directory-card .rank{color:var(--blue);font-weight:700}
.rank-chip{display:inline-flex;align-items:center;gap:5px;margin-right:6px;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:.72rem;letter-spacing:.04em;vertical-align:middle}
.top-1 .rank-chip{color:#ffd36c;border-color:#e6ac3f88;background:#e6ac3f18}
.top-2 .rank-chip{color:#d8e4ef;border-color:#a8bed288;background:#a8bed218}
.top-3 .rank-chip{color:#e8a77c;border-color:#cd7f5088;background:#cd7f5018}
.rank-flame{display:inline-block;transform-origin:50% 85%;animation:directoryFire .75s ease-in-out infinite alternate}
.rank-spark{display:inline-block;animation:directorySpark 1.3s ease-in-out infinite}
@keyframes directoryFire{from{transform:translateY(1px) scale(.92) rotate(-5deg);filter:drop-shadow(0 0 2px #ff5a1f)}to{transform:translateY(-2px) scale(1.12) rotate(5deg);filter:drop-shadow(0 0 9px #ff9a24)}}
@keyframes directorySpark{0%,100%{opacity:.35;transform:scale(.75)}50%{opacity:1;transform:scale(1.18)}}
.directory-flairs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 12px}
.directory-flair{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--ink);font-size:.78rem;background:#ffffff06}
.directory-flair-icon{font-size:.95rem;line-height:1}
.directory-dialog{width:min(620px,calc(100% - 28px));max-height:min(85vh,760px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 24px 90px #000b}
.directory-dialog::backdrop{background:#02070dcc;backdrop-filter:blur(7px)}
.directory-dialog h2{margin:0 40px 10px 0}
.directory-dialog p{color:var(--mute);white-space:pre-wrap;overflow-wrap:anywhere}
.directory-dialog .dtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.directory-dialog .dclose{border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--ink);padding:7px 11px;cursor:pointer}
.directory-dialog .dflairs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.directory-dialog .consent{display:flex;gap:10px;align-items:flex-start;padding:14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;color:var(--ink)}
.directory-dialog .consent input{margin-top:5px}
.directory-dialog .join-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
@media(max-width:600px){.directory-card{padding:14px}.directory-list{grid-template-columns:1fr}}
</style>

function route() {
  leave();
  document.title = 'BlueHunter';
  const m = location.hash.match(/^#\/g\/([0-9-]+)$/);
  if (location.hash === '#/groupchats' || (location.pathname === '/groupchats' && !location.hash)) return groupChats();
  if (location.hash === '#/changelog') return changelog();
  if (location.hash === '#/owner') return ownerPanel();
  m ? dash(m[1]) : home();
}

// Maintenance message: shown as a banner on the home page and the dashboard.
function maintCard() {
  const ta = h('textarea', { maxlength: '300', placeholder: 'For example: BlueHunter will be down for maintenance tonight from 9pm to 10pm.', 'aria-label': 'Maintenance message' });
  const state = h('small', {}, 'Loading\u2026');

  const post = h('button', { class: 'btn', onclick: () => save(ta.value) }, 'Show on website');
  const clear = h('button', { class: 'btn ghost', onclick: () => save('') }, 'Clear message');
  const sync = (d) => { state.textContent = d.active ? 'Visible to everyone right now.' : 'No maintenance message is showing.'; if (d.active) ta.value = d.message; showMaintenance(); };
  async function save(text) {
    if (text.trim() && !confirm('Show this message on the website for everyone?')) return;
    post.disabled = clear.disabled = true;
    try { const d = await api('/owner/maintenance', { method: 'POST', body: JSON.stringify({ message: text }) }); if (!d.active) ta.value = ''; sync(d); toast(d.active ? 'Maintenance message is live' : 'Message cleared'); }
    catch (e) { toast(e.message, true); }
    post.disabled = clear.disabled = false;
  }
  ta.addEventListener('input', () => { count.textContent = ta.value.length + '/300'; });
  api('/owner/maintenance').then(sync).catch(() => { state.textContent = ''; });
  return h('div', { class: 'mcard' }, h('h3', {}, 'Maintenance message'),
    h('small', {}, 'A notice at the top of the home page and the dashboard. It stays until you clear it, even after a restart.'),
    ta, h('div', { class: 'acts' }, post, clear, count), state);
}

// The changelog lives on its own page, reachable from the nav - not cluttering
// the home screen.
const CL_CATS = [
  ['owner', '\u{1F451} Owner', /owner|maintenance/i],
  ['web', '\u2728 Website', /home page|sign in|signing in|website|banner|changelog page|status at the top/i],
  ['mod', '\u{1F6E1}\uFE0F Moderation', /moderation|deleted|warn|mute|kick|\bban|antilink|antispam|raid|bad.?word|blocked words|auto-leave|safety/i],
  ['activity', '\u{1F4C8} Activity', /graph|activity|leaderboard|low-activity|inactive|member list/i],
  ['ai', '\u{1F916} AI', /\bai\b|sticker|roast|savage|voice repl|giphy/i],
  ['web', '\u2728 Website', /dashboard|site|tab\b|panel|status|look/i],
  ['cmd', '\u2699\uFE0F Commands', /\/\w+|command/i],
];
const clCat = (t) => { const c = CL_CATS.find(([, , re]) => re.test(t)); return c ? { key: c[0], label: c[1] } : { key: 'other', label: '\u{1F539} Update' }; };
function clWhen(date) {
  const days = Math.round((Date.now() - new Date(date + 'T00:00:00Z').getTime()) / 86400000);
  if (days <= 0) return 'today'; if (days === 1) return 'yesterday'; if (days < 14) return days + ' days ago';
  if (days < 60) return Math.round(days / 7) + ' weeks ago'; return Math.round(days / 30) + ' months ago';
}
async function changelog() {
  clearInterval(timer);
  const stat = h('div', { class: 'clstats' }), chips = h('div', { class: 'clf' });
  const list = h('div', { class: 'cl' }, h('p', { style: 'color:var(--mute)' }, 'Loading\u2026'));
  app.replaceChildren(
    h('section', { class: 'clh' }, h('a', { href: '#/' }, '\u2190 Back'), h('h1', {}, 'What\u2019s new'),
      h('p', {}, 'Every update to BlueHunter, newest first.'), stat),
    chips, list);
  let entries = [], filter = 'all', showAll = false, io = null;
  stops.push(() => io && io.disconnect());
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw() {
    if (io) io.disconnect();
    io = 'IntersectionObserver' in window && !reduce ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.12 }) : null;
    const shown = entries.map((en) => ({ ...en, notes: en.notes.filter((n) => filter === 'all' || n.cat.key === filter) })).filter((en) => en.notes.length);
    const cut = showAll ? shown : shown.slice(0, 5);
    const nodes = cut.map((en, i) => {
      const li = h('article', { class: 'cle' + (en.date === entries[0].date ? ' latest' : ''), style: '--i:' + Math.min(i, 4) },

  try {

    const btns = [['all', { label: 'Everything', n: total }], ...[...counts.entries()].sort((a, b) => b[1].n - a[1].n)];

    draw();

}
addEventListener('hashchange', route);
async function showMaintenance() {
  try {
    const s = await api('/status');
    const box = document.getElementById('maint'), mt = s.maintenance && s.maintenance.message;
    box.hidden = !mt; if (mt) document.getElementById('maintText').textContent = mt;

<script id="fx-js">
/* ================= PREMIUM FX LAYER =================
   Purely visual. It never touches your data or logic; if anything here fails the dashboard
   keeps working. Delete this whole <script> (and the FX block in the CSS) to remove it. */
(function () {
  'use strict';
  try {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const fine = matchMedia('(hover:hover) and (pointer:fine)').matches;
    const LOW = innerWidth < 700 || (navigator.deviceMemory && navigator.deviceMemory <= 2) || (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 3);
    const root = document.documentElement, body = document.body;
    root.classList.add('fx-on'); if (LOW) root.classList.add('fx-low'); if (fine) root.classList.add('fx-fine');
    const app = document.getElementById('app');
    const mk = (tag, id, cls) => { const e = document.createElement(tag); if (id) e.id = id; if (cls) e.className = cls; return e; };

    /* ---------- ambient layers ---------- */
    if (!LOW) body.insertBefore(mk('div', '', 'fx-aurora'), body.firstChild);
    const prog = mk('div', 'fx-prog'); body.appendChild(prog);
    let cursor = null; if (fine && !LOW) { cursor = mk('div', 'fx-cursor'); body.appendChild(cursor); }

    /* ---------- particle network ---------- */
    (function particles() {
      const cv = mk('canvas', 'fx-bg'); body.insertBefore(cv, body.firstChild);
      const ctx = cv.getContext('2d'); if (!ctx) return;
      let W = 0, H = 0, P = [], mx = -9999, my = -9999, last = performance.now(), run = true;
      const spawn = () => { const a = Math.random() * 6.283, s = .08 + Math.random() * .16; return { x: Math.random() * W, y: Math.random() * H, bx: Math.cos(a) * s, by: Math.sin(a) * s, vx: 0, vy: 0, r: Math.random() * 1.5 + .6, t: Math.random() * 6.283 }; };
      function size() {
        const dpr = Math.min(devicePixelRatio || 1, LOW ? 1 : 1.5);
        W = innerWidth; H = innerHeight;
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); cv.style.width = W + 'px'; cv.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      let lw = innerWidth, lh = innerHeight;
      addEventListener('resize', () => { if (innerWidth !== lw || Math.abs(innerHeight - lh) > 160) { lw = innerWidth; lh = innerHeight; size(); } }, { passive: true });
      addEventListener('pointermove', (e) => { mx = e.clientX; my = e.clientY; }, { passive: true });
      addEventListener('pointerleave', () => { mx = my = -9999; });
      size();
      const LD = LOW ? 105 : 130, LD2 = LD * LD;
      function frame(now) {
        if (!run) return;
        const k = Math.min(40, now - last) / 16.7; last = now;
        ctx.clearRect(0, 0, W, H);
        for (let i = 0; i < P.length; i++) {
          const p = P[i]; p.t += .02 * k;
          const dx = p.x - mx, dy = p.y - my, d2 = dx * dx + dy * dy;
          if (d2 < 26000 && d2 > 1) { const f = (1 - d2 / 26000) * .9; p.vx += dx / Math.sqrt(d2) * f * .08 * k; p.vy += dy / Math.sqrt(d2) * f * .08 * k; }
          p.vx += (p.bx - p.vx) * .02 * k; p.vy += (p.by - p.vy) * .02 * k;
          p.x += p.vx * k; p.y += p.vy * k;
          if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
          if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
          const a = .38 + .32 * Math.sin(p.t);
          ctx.fillStyle = 'rgba(127,208,255,' + a.toFixed(3) + ')';
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
          for (let j = i + 1; j < P.length; j++) {
            const q = P[j], ex = p.x - q.x, ey = p.y - q.y, dd = ex * ex + ey * ey;
            if (dd < LD2) { ctx.strokeStyle = 'rgba(59,155,222,' + ((1 - dd / LD2) * .2).toFixed(3) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
          }
          const ml = (p.x - mx) * (p.x - mx) + (p.y - my) * (p.y - my);
          if (ml < 24000) { ctx.strokeStyle = 'rgba(127,208,255,' + ((1 - ml / 24000) * .45).toFixed(3) + ')'; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mx, my); ctx.stroke(); }
        }
        requestAnimationFrame(frame);
      }
      document.addEventListener('visibilitychange', () => { run = !document.hidden; if (run) { last = performance.now(); requestAnimationFrame(frame); } });
      requestAnimationFrame(frame);
    })();

    /* ---------- scroll: progress bar, glass header, parallax glows ---------- */
    const glows = [...document.querySelectorAll('.glow')];
    let sTick = false;
    function onScroll() {
      if (sTick) return; sTick = true;
      requestAnimationFrame(() => {
        sTick = false;
        const y = scrollY, max = root.scrollHeight - innerHeight;
        prog.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, y / max) : 0).toFixed(4) + ')';
        body.classList.toggle('fx-scrolled', y > 12);
        glows.forEach((g, i) => { g.style.translate = '0 ' + Math.round(y * (i ? .12 : .2)) + 'px'; });
      });
    }
    addEventListener('scroll', onScroll, { passive: true }); onScroll();

    /* ---------- pointer: cursor glow, spotlight, 3D tilt, ripple ---------- */
    let px = innerWidth / 2, py = innerHeight / 2, cx = px, cy = py, ptr = null, tiltEl = null, ptrTick = false;
    if (cursor) (function loop() {
      cx += (px - cx) * .12; cy += (py - cy) * .12;
      cursor.style.transform = 'translate(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px)';
      requestAnimationFrame(loop);
    })();
    function tiltEnd(el) {
      el.style.transition = 'transform .7s cubic-bezier(.2,.8,.2,1), border-color .15s, box-shadow .3s';
      el.style.transform = '';
      setTimeout(() => { if (el !== tiltEl) el.style.transition = ''; }, 720);
    }
    function pointerWork() {
      ptrTick = false; const e = ptr; if (!e) return;
      const t = e.target && e.target.closest ? e.target : null; if (!t) return;
      const f = t.closest('.fx');
      if (f) { const r = f.getBoundingClientRect(); f.style.setProperty('--mx', (e.clientX - r.left) + 'px'); f.style.setProperty('--my', (e.clientY - r.top) + 'px'); }
      if (!fine) return;
      const el = t.closest('.card,.stat,.otile');
      if (tiltEl && tiltEl !== el) { tiltEnd(tiltEl); tiltEl = null; }
      if (!el || el.hasAttribute('data-fx-r')) return;
      tiltEl = el;
      const r = el.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
      el.style.transition = 'transform .12s ease-out, border-color .15s, box-shadow .3s';
      el.style.transform = 'perspective(800px) rotateX(' + ((.5 - fy) * 9).toFixed(2) + 'deg) rotateY(' + ((fx - .5) * 11).toFixed(2) + 'deg) translateY(-3px) scale(1.018)';
    }
    addEventListener('pointermove', (e) => {
      px = e.clientX; py = e.clientY; if (cursor) cursor.style.opacity = 1;
      ptr = e; if (!ptrTick) { ptrTick = true; requestAnimationFrame(pointerWork); }
    }, { passive: true });
    document.addEventListener('pointerleave', () => { if (cursor) cursor.style.opacity = 0; if (tiltEl) { tiltEnd(tiltEl); tiltEl = null; } });
    document.addEventListener('pointerdown', (e) => {
      const t = e.target.closest && e.target.closest('.btn,.tab,.seg,.chip2,.clf button');
      if (!t || t.disabled) return;
      const r = t.getBoundingClientRect(), s = Math.max(r.width, r.height) * 2, sp = mk('span', '', 'fx-rip');
      sp.style.cssText = 'width:' + s + 'px;height:' + s + 'px;left:' + (e.clientX - r.left - s / 2) + 'px;top:' + (e.clientY - r.top - s / 2) + 'px';
      t.appendChild(sp); sp.addEventListener('animationend', () => sp.remove());
    }, { passive: true });

    /* ---------- number count-up (+ glow when a live number changes) ---------- */
    const NUM = /^\s*\d[\d,]*\s*$/;
    const ease = (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t));
    function watch(el) {
      let lastText = el.textContent;
      new MutationObserver(() => {
        const now = el.textContent; if (now === lastText) return; lastText = now;
        el.classList.remove('fx-tick'); void el.offsetWidth; el.classList.add('fx-tick');
      }).observe(el, { childList: true, characterData: true, subtree: true });
    }
    function countUp(el) {
      if (el.__fxc) return; el.__fxc = 1;
      const node = el.firstChild;
      if (!node || node.nodeType !== 3 || el.childNodes.length !== 1 || !NUM.test(node.nodeValue)) { watch(el); return; }
      const raw = node.nodeValue.trim(), commas = raw.indexOf(',') > -1, to = parseInt(raw.replace(/,/g, ''), 10);
      if (!(to >= 2)) { watch(el); return; }
      const fmt = (n) => (commas ? n.toLocaleString() : String(n)), dur = Math.min(1600, 700 + Math.log10(to) * 220), t0 = performance.now();
      node.nodeValue = fmt(0);
      (function step(now) {
        const t = Math.min(1, (now - t0) / dur);
        if (node.parentNode === el) node.nodeValue = fmt(Math.round(to * ease(t)));
        if (t < 1) requestAnimationFrame(step); else watch(el);
      })(t0);
    }

    /* ---------- scroll reveal, charts, tabs, loading shimmer ---------- */
    const RV = '.card,.stat,.otile,.chartbox,.dm,.lg,.ogrp,.mcard,.emptybox,.row,.mem,.bar-row,.chip2,.clstats span,.clf button,.grouplist a,.blk>h2,.welcome>h2,.welcome>p,.cstats,.otools,.segs,.log>ul,.adm,.admhead,.admsec';
    const FXS = '.card,.stat,.otile,.chartbox,.dm,.lg,.ogrp,.mcard,.clc,.adm';
    const CNT = '.stat b,.otile b,.cstats b,.clstats b';
    const seen = new WeakSet();
    let epochAt = performance.now(), curHash = null;
    const mode = () => (performance.now() - epochAt < 2600 ? 'full' : 'soft');

    const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => {
      const vis = es.filter((x) => x.isIntersecting).sort((a, b) => a.boundingClientRect.top - b.boundingClientRect.top || a.boundingClientRect.left - b.boundingClientRect.left);
      vis.forEach((x, i) => { io.unobserve(x.target); reveal(x.target, Math.min(i, 9) * (LOW ? 45 : 75)); });

      el.style.setProperty('--d', (full ? d : 0) + 'ms');
      el.classList.add('fx-in');
      if (full) {
        el.querySelectorAll('.line').forEach((l) => { l.querySelectorAll('polyline').forEach((p) => p.setAttribute('pathLength', '1')); l.classList.add('fx-draw'); });
        if (el.matches('.line')) { el.querySelectorAll('polyline').forEach((p) => p.setAttribute('pathLength', '1')); el.classList.add('fx-draw'); }
        setTimeout(() => { if (el.matches(CNT)) countUp(el); el.querySelectorAll(CNT).forEach(countUp); }, d + 250);

    }

      const ind = mk('span', '', 'fx-ind'); t.appendChild(ind);
      const place = () => {
        if (!ind.parentNode) t.appendChild(ind);
        const on = t.querySelector('.tab.on');

        ind.style.opacity = 1; ind.style.width = on.offsetWidth + 'px'; ind.style.transform = 'translateX(' + on.offsetLeft + 'px)';
      };

      addEventListener('resize', place, { passive: true });

    }

          if (seen.has(el)) continue; seen.add(el);
          if (el.closest('.sx,.cle')) continue;
          if (el.parentElement && el.parentElement.closest('[data-fx-r]')) continue;

      const fxs = []; if (n.matches(FXS)) fxs.push(n); n.querySelectorAll(FXS).forEach((x) => fxs.push(x));
      fxs.forEach((x) => x.classList.add('fx'));

      n.querySelectorAll('p').forEach((p) => { if (/^Loading/i.test(p.textContent)) p.classList.add('fx-ld'); });
    }

    new MutationObserver((recs) => { for (const r of recs) r.addedNodes.forEach(prep); }).observe(app, { childList: true, subtree: true });
    prep(app);
  } catch (err) { console.warn('FX layer disabled:', err); }
})();
